name: reciepe_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6

  # Networking
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0

  # Functional Programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^8.0.3

  # Equality
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

